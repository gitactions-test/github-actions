name: output-test
on: push

jobs:
    create-output:
        runs-on: ubuntu-latest
        outputs:
            job-output-key: ${{steps.test-id.outputs.testKey}}
        steps:
            - name: output
              id: test-id
              run: |
                echo "testKey=output-test-value" >> $GITHUB_OUTPUT
            - name: check
              run: |
                echo ${{steps.test-id.outputs.testKey}}

    get-output:
        runs-on: ubuntu-latest
        needs: [create-output]
        steps:
            - name: get
              run: |
                echo ${{needs.create-output.outputs.job-output-key}}
