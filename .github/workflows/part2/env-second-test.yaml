name: environment-test-flow
on: push

jobs:
    get-env-job:
        runs-on: ubuntu-latest
        steps:
            - name: get env
              run: |
               echo ${{vars.LEVELS}}
               echo ${{secrets.KEY}}
    get-dev-env-job:
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: get env
              run: |
               echo ${{vars.LEVELS}}
               echo ${{secrets.KEY}}