name: needs
on: push

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: step1
              run: echo "job1 step1"
    job2:
        runs-on: ubuntu-latest
        needs: [job1]
        steps:
            - name: step1
              run: echo "job2 step1"
    job3:
        runs-on: ubuntu-latest
        steps:
            - name: step1
              run: |
               echo "job3 step1"
               exit 1
    job4:
        runs-on: ubuntu-latest
        needs: [job3]
        steps:
            - name: step1
              run: echo "job4 step1"
