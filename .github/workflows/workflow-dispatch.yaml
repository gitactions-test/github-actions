name: dispatch-test-workflow
on:
    workflow_dispatch:
        inputs:
            name:
                description: "set name"
                required: true
                default: 'github-actions'
                type: string
            environment:
                description: 'set env'
                required: true
                default: 'github-actions'
                type: choice
                options:
                - dev
                - qa
                - prod
jobs:
    test-job:
        runs-on: ubuntu-latest
        steps:
        - name : step1
          run: echo hello world
        - name : step2
          run: |
            echo hello world
            echo github action
        - name : echo input test
          run: |
            echo ${{inputs.name}}
            echo ${{inputs.environment}}

